<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100">
  <defs>
    <!-- Suit Shading Gradients -->
    <linearGradient id="spideyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b"/>
      <stop offset="60%" stop-color="#d61426"/>
      <stop offset="100%" stop-color="#8c0714"/>
    </linearGradient>
    <linearGradient id="spideyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b73"/>
    </linearGradient>
    <linearGradient id="lensGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dynamic Spider-Man Flight Pose (Facing Right) -->
  <g id="spiderman-hero" transform="translate(10, 5)">
    <!-- Back Arm (Trailing Aerodynamic) -->
    <path d="M 42 45 L 20 40 L 10 32 L 8 36 L 18 46 L 38 52 Z" fill="#1d4ed8" stroke="#0a1838" stroke-width="1.5"/>
    <path d="M 20 40 L 10 32 L 8 36 L 18 46 Z" fill="url(#spideyRed)" stroke="#0a1838" stroke-width="1.5"/>

    <!-- Back Leg (Trailing Leg in Streamline Flight) -->
    <path d="M 38 52 L 18 64 L 2 72 L 4 77 L 22 68 L 42 58 Z" fill="url(#spideyBlue)" stroke="#0a1838" stroke-width="1.5"/>
    <!-- Back Boot -->
    <path d="M 16 66 L 2 72 L 4 77 L 20 70 Z" fill="url(#spideyRed)" stroke="#0a1838" stroke-width="1.2"/>

    <!-- Front Leg (Bent Knee High Velocity Pose) -->
    <path d="M 48 54 L 34 68 L 26 84 L 32 87 L 42 70 L 56 58 Z" fill="url(#spideyBlue)" stroke="#0a1838" stroke-width="1.5"/>
    <!-- Front Boot -->
    <path d="M 32 72 L 26 84 L 32 87 L 40 73 Z" fill="url(#spideyRed)" stroke="#0a1838" stroke-width="1.2"/>
    <!-- Web Pattern on Boot -->
    <line x1="28" y1="80" x2="36" y2="78" stroke="#330307" stroke-width="0.8"/>

    <!-- Torso / Body -->
    <!-- Blue Sides -->
    <path d="M 44 38 Q 36 46 40 56 Q 52 58 60 52 Q 54 44 48 38 Z" fill="url(#spideyBlue)" stroke="#0a1838" stroke-width="1.5"/>
    <!-- Red Center Chest & Shoulder -->
    <path d="M 48 34 Q 66 32 72 42 Q 68 56 56 56 Q 44 54 44 42 Z" fill="url(#spideyRed)" stroke="#0a1838" stroke-width="1.5"/>

    <!-- Iconic Black Chest Spider Emblem -->
    <!-- Spider Body -->
    <ellipse cx="60" cy="45" rx="2.5" ry="4" fill="#09090b"/>
    <!-- Spider Legs (Upper 4 legs) -->
    <path d="M 60 43 Q 66 36 72 38" stroke="#09090b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 60 44 Q 68 42 73 45" stroke="#09090b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 59 43 Q 54 36 50 38" stroke="#09090b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 59 44 Q 52 42 48 45" stroke="#09090b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Spider Legs (Lower 4 legs) -->
    <path d="M 60 46 Q 66 50 71 52" stroke="#09090b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 60 47 Q 64 54 67 56" stroke="#09090b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 59 46 Q 54 50 50 52" stroke="#09090b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 59 47 Q 56 54 53 56" stroke="#09090b" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- Front Arm (Reaching Forward Shooting Web) -->
    <path d="M 66 38 L 86 34 L 104 28 L 107 33 L 90 40 L 70 44 Z" fill="url(#spideyRed)" stroke="#0a1838" stroke-width="1.5"/>
    <!-- Blue under-arm segment -->
    <path d="M 72 41 L 86 37 L 88 40 L 74 44 Z" fill="url(#spideyBlue)"/>
    <!-- Web Pattern Lines on Arm -->
    <line x1="84" y1="34" x2="88" y2="40" stroke="#330307" stroke-width="0.8"/>
    <line x1="96" y1="30" x2="99" y2="36" stroke="#330307" stroke-width="0.8"/>
    <!-- Wrist & Web Shooter Hand (Classic Spidey "Thwip" 2-fingers-in pose) -->
    <path d="M 104 28 L 112 26 Q 115 28 112 30 L 108 31 L 114 34 L 111 36 L 106 33 Z" fill="url(#spideyRed)" stroke="#0a1838" stroke-width="1.2"/>
    <!-- Metallic Web Shooter Nozzle -->
    <circle cx="106" cy="31" r="1.5" fill="#e2e8f0" stroke="#0f172a" stroke-width="0.6"/>

    <!-- Head & Mask -->
    <!-- Mask Base (Streamlined Oval Angle) -->
    <path d="M 68 28 Q 72 16 86 16 Q 98 16 98 28 Q 98 38 88 40 Q 76 40 68 28 Z" fill="url(#spideyRed)" stroke="#0a1838" stroke-width="1.6"/>
    <!-- Mask Webbing Grid Lines -->
    <path d="M 86 16 Q 86 28 86 40" stroke="#4a040b" stroke-width="0.9" fill="none"/>
    <path d="M 72 22 Q 86 26 98 22" stroke="#4a040b" stroke-width="0.9" fill="none"/>
    <path d="M 70 32 Q 86 33 96 32" stroke="#4a040b" stroke-width="0.9" fill="none"/>
    <path d="M 78 18 Q 88 28 92 38" stroke="#4a040b" stroke-width="0.9" fill="none"/>

    <!-- Authentic Spider-Man Eye Lens (Front Eye) -->
    <!-- Black Outer Rim Border -->
    <path d="M 80 23 Q 86 20 95 24 Q 94 33 83 33 Q 78 30 80 23 Z" fill="#09090b" stroke="#000000" stroke-width="1.5"/>
    <!-- Glossy White Triangular Lens -->
    <path d="M 82 24 Q 87 22 93 25 Q 92 31 84 31 Q 81 29 82 24 Z" fill="url(#lensGloss)" filter="url(#neonGlow)"/>
    <!-- White Specular Sparkle Highlight -->
    <polygon points="85,25 88,24 87,27" fill="#ffffff"/>

    <!-- Web Fluid Blast Emitter Effect (Thwip Sparks) -->
    <circle cx="114" cy="27" r="2.5" fill="#38bdf8" filter="url(#neonGlow)"/>
    <line x1="113" y1="27" x2="128" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="114" y1="26" x2="124" y2="20" stroke="#bae6fd" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="114" y1="28" x2="123" y2="33" stroke="#bae6fd" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
